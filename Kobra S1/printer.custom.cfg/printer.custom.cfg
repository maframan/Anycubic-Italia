# Dare comando da terminale di Rinkhals: PID_CALIBRATE HEATER=heater_bed TARGET=80
[heater_bed] 
#pid_Kp : 40.930
#pid_Ki : 2.255
#pid_Kd : 185.719

# Dare comando da terminale di Rinkhals: PID_CALIBRATE HEATER=extruder TARGET=200
[extruder] 
#pid_Kp : 31.482
#pid_Ki : 7.773
#pid_Kd : 31.876

[stepper_x]
microsteps : 16

[stepper_y]
microsteps : 16

[stepper_z]
microsteps : 16
homing_speed: 8
homing_retract_dist:4
second_homing_speed:2

[tmc2209 stepper_x]
run_current : 1.3
!hold_current:
stealthchop_threshold: 99999
driver_SEMIN: 5
driver_SEUP: 1
driver_SEMAX: 5
driver_SEDN: 1
driver_SEIMIN: 0

[tmc2209 stepper_y]
run_current : 1.3
!hold_current:
stealthchop_threshold: 99999
driver_SEMIN: 5
driver_SEUP: 1
driver_SEMAX: 5
driver_SEDN: 1
driver_SEIMIN: 0

[tmc2209 stepper_z]
run_current : 1.5
!hold_current:
stealthchop_threshold: 99999
driver_SEMIN: 5
driver_SEUP: 1
driver_SEMAX: 5
driver_SEDN: 1
driver_SEIMIN: 0

[tmc2209 extruder]
run_current : 0.9
hold_current:0.5

[filament_hub]
default_unwind_speed:70
unwind_speed_old_ace:70
default_feed_speed: 80
unwind_length_after_triggered: 1250
feed_max_length: 2600
enable_feed_assist: 1
enable_rfid: 1
delay_before_throw: 3
flush_volume_min: 107
flush_volume_max: 800
flush_multiplier: 1.5

[printer]
max_accel:10000
!max_accel_to_decel:
square_corner_velocity:5.0
max_z_velocity:15
max_z_accel:250
!jump_speed_min :
!jump_speed_max :

[leviQ3]
bed_temp: 80

[bed_mesh]
speed: 200
mesh_pps:2,2
probe_count:6,6
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 2.5
fade_start: 1
fade_end: 10
fade_target: 0

[probe]
speed : 2.0
final_speed : 2.0
samples: 3
samples_tolerance: 0.015
samples_tolerance_retries:10

[resonance_tester]
accel_per_hz : 110
hz_per_sec : 1
test_freq_start: 30
test_freq_end: 100

[gcode_arcs]
resolution: 0.1
